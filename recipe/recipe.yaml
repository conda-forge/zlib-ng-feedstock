# Obtain from ZLIB_VERSION in zlib.h.in; https://github.com/zlib-ng/zlib-ng/blob/VERSION/zlib.h.in#L61
# Please do not reset the build number unless zlib_api changed. It needs to be
# incremental across both outputs using version and these using zlib_api.
schema_version: 1

context:
  version: "2.3.3"
  zlib_api: "1.3.1"
  number: 1

recipe:
  name: zlib-ng-split
  version: ${{ version }}

source:
  url: https://github.com/zlib-ng/zlib-ng/archive/refs/tags/${{ version }}.tar.gz
  sha256: f9c65aa9c852eb8255b636fd9f07ce1c406f061ec19a2e7d508b318ca0c907d1

build:
  number: ${{ number }}
  variant:
    use_keys:
      - compat

outputs:
  - staging:
      name: zlib-ng-build
    build:
      script:
        file: build
        env:
          ZLIB_COMPAT: ${{ "0" if compat == "no" else "1" }}
          CONDA_BUILD_SKIP_TESTS: ${{ CONDA_BUILD_SKIP_TESTS | default("0") }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - if: unix
          then: make
      host:
        - if: compat == "yes"
          then: gtest

  # zlib-ng gets built when compat is NOT enabled; versioned with the regular zlib-ng release.
  - package:
      name: zlib-ng
    inherit: zlib-ng-build
    build:
      skip: compat == "yes"
    requirements:
      run_exports:
        # Just guessing since the library is so new, but it aims to be backward compatible.
        # https://abi-laboratory.pro/index.php?view=timeline&l=zlib-ng
        - ${{ pin_subpackage('zlib-ng', upper_bound='x.x') }}
    tests:
      - package_contents:
          include:
            - zlib-ng.h
            - zconf-ng.h
          lib:
            - if: unix
              then: z-ng
            - if: win
              then: zlib-ng
          files:
            - if: unix
              then: lib/pkgconfig/zlib-ng.pc
            - if: win
              then:
                - Library/bin/zlib-ng2.dll
                - Library/lib/pkgconfig/zlib-ng.pc

  # zlib and libzlib get built when compat is enabled; they are versioned after the zlib API.
  - package:
      name: libzlib
      version: ${{ zlib_api }}
    inherit: zlib-ng-build
    build:
      skip: compat == "no"
      string: h${{ hash }}_ng_${{ version | replace(".", "") }}_${{ number }}
      variant:
        down_prioritize_variant: 1
      files:
        - if: linux
          then: lib/libz.so.*
        - if: osx
          then: lib/libz.*.dylib
        - if: win
          then:
            - Library/bin/zlib.dll
            - zlib.dll
    requirements:
      run:
        - ${{ pin_subpackage('zlib-ng-compat', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
    tests:
      - package_contents:
          files:
            exists:
              - if: linux
                then: lib/libz.so.*
              - if: osx
                then: lib/libz.*.dylib
              - if: win
                then:
                  - Library/bin/zlib.dll
                  - zlib.dll
            not_exists:
              - if: unix
                then:
                  - include/zlib.h
                  - lib/libz.a
                  - lib/libz.so
                  - lib/libz.dylib

  - package:
      name: zlib
      version: ${{ zlib_api }}
    inherit: zlib-ng-build
    build:
      skip: compat == "no"
      string: h${{ hash }}_ng_${{ version | replace(".", "") }}_${{ number }}
      variant:
        down_prioritize_variant: 1
      files:
        include:
          - "**/*"
        exclude:
          - if: linux
            then: lib/libz.so.*
          - if: osx
            then: lib/libz.*.dylib
          - if: win
            then:
              - Library/bin/zlib.dll
              - Library/bin/zlib1.dll
              - zlib.dll
    requirements:
      run:
        - ${{ pin_subpackage('libzlib', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
    tests:
      - package_contents:
          include:
            - zlib.h
            - zconf.h
          lib:
            - z
          files:
            - if: unix
              then: lib/pkgconfig/zlib.pc
            - if: win
              then: Library/lib/pkgconfig/zlib.pc
      - if: unix
        then:
          script:
            - grep "ZLIB_VERSION.*${{ zlib_api }}\.zlib-ng" $PREFIX/include/zlib.h

  - package:
      name: zlib-ng-compat
    build:
      skip: compat == "no"
    tests:
      - package_contents:
          files:
            not_exists:
              - include/zlib.h
              - lib/libz.a

  # *-wapi targets are built on Windows with compat enabled.
  - package:
      name: libzlib-wapi
      version: ${{ zlib_api }}
    inherit: zlib-ng-build
    build:
      skip: compat == "no" or not win
      string: h${{ hash }}_ng_${{ version | replace(".", "") }}_${{ number }}
      variant:
        down_prioritize_variant: 1
      files:
        - Library/bin/zlibwapi.dll
    requirements:
      run:
        - ${{ pin_subpackage('zlib-ng-compat', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
    tests:
      - package_contents:
          files:
            - Library/bin/zlibwapi.dll

  - package:
      name: zlib-wapi
      version: ${{ zlib_api }}
    inherit: zlib-ng-build
    build:
      skip: compat == "no" or not win
      string: h${{ hash }}_ng_${{ version | replace(".", "") }}_${{ number }}
      variant:
        down_prioritize_variant: 1
      files:
        - Library/lib/zlibwapi.lib
        - Library/include/zlib.h
    requirements:
      run:
        - ${{ pin_subpackage('libzlib-wapi', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
    tests:
      - package_contents:
          include:
            - zlib.h
          lib:
            - zlibwapi

about:
  homepage: https://github.com/zlib-ng/zlib-ng
  repository: https://github.com/zlib-ng/zlib-ng
  license: Zlib
  license_file: LICENSE.md
  summary: zlib data compression library for the next generation systems

extra:
  feedstock-name: zlib-ng
  recipe-maintainers:
    - hmaarrfk
    - mgorny
    - isuruf
